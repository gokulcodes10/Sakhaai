<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)" />

    <title>Asphalix — Agents that hold under load.</title>
    <meta
      name="description"
      content="Asphalix builds agentic AI that answers your customers and acts inside your systems — live in weeks, on infrastructure you control, with code you own."
    />
    <link rel="canonical" href="https://asphalix.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Asphalix" />
    <meta property="og:title" content="Asphalix — Agents that hold under load." />
    <meta property="og:description" content="Agentic AI that reaches production, inside your perimeter, with code you own." />
    <meta property="og:url" content="https://asphalix.com/" />
    <meta property="og:image" content="https://asphalix.com/og/asphalix-default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so a dark-mode visitor never sees a flash of
      // the light theme.
      (function () {
        try {
          // The key was 'sakha-theme' before the rebrand; carry it over once.
          var stored = localStorage.getItem('asphalix-theme');
          if (!stored) {
            stored = localStorage.getItem('sakha-theme');
            if (stored) {
              localStorage.setItem('asphalix-theme', stored);
              localStorage.removeItem('sakha-theme');
            }
          }
          var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefers)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
