# ── Shared proxy settings ────────────────────────────────────────────────────
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_connect_timeout 5s;
proxy_send_timeout    70s;
proxy_read_timeout    70s;   # Sakha's tool loop can legitimately take a while.
proxy_buffering       on;
proxy_buffer_size     8k;
proxy_buffers         16 8k;

# ─────────────────────────────────────────────────────────────────────────────
#  HTTP — redirect to HTTPS, except the ACME challenge
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sakhaai.com www.sakhaai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check must work over plain HTTP for load balancers.
    location = /api/health {
        proxy_pass http://sakha_api;
        access_log off;
    }

    location / {
        return 301 https://sakhaai.com$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
#  www -> apex
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sakhaai.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://sakhaai.com$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
#  Main site
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sakhaai.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    limit_conn perip 24;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # The SPA needs 'unsafe-inline' for its styles (Tailwind injects some at
    # runtime) but NOT for scripts, which is the half that actually matters.
    # fonts.googleapis / gstatic are allowed because index.html links them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── Auth: strictest limit, no caching, ever ───────────────────────────────
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://sakha_api;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ── Sakha: every call costs money, and answers stream slowly ──────────────
    location /api/sakha/chat {
        limit_req zone=sakha burst=4 nodelay;
        proxy_pass http://sakha_api;
        proxy_read_timeout 120s;
        proxy_buffering off;          # let the answer through as it arrives
        add_header Cache-Control "no-store" always;
    }

    # ── Rest of the API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://sakha_api;
    }

    # ── Uploaded files, served straight off disk ──────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Never let an uploaded file execute or render as a document.
        add_header Content-Disposition "inline" always;
        try_files $uri =404;
    }

    # ── Hashed build assets: cache forever ────────────────────────────────────
    location /assets/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://sakha_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── The SPA ───────────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://sakha_web;
        # index.html itself must never be cached, or a deploy leaves visitors
        # on an old build pointing at asset hashes that no longer exist.
        add_header Cache-Control "no-cache" always;
    }
}
