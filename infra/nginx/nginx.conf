# ─────────────────────────────────────────────────────────────────────────────
#  Sakha AI — Nginx reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the upstream time too — when someone says "the site is slow", this
    # tells you immediately whether it was Node or the network.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # A coarse first line of defence. The API does the precise, per-user,
    # per-endpoint limiting in Redis; this is here to stop a flood ever
    # reaching Node in the first place.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=1r/s;
    limit_req_zone $binary_remote_addr zone=sakha:10m   rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream sakha_api {
        server api:4000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream sakha_web {
        server web:80 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
