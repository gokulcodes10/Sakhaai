<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 64 64" width="{{ w }}" height="{{ h }}" fill="none" style="display:block">
  <path d="M11 52 L32 13 L53 52" stroke="{{ ink }}" stroke-width="{{ weight }}" stroke-linecap="round" stroke-linejoin="round"></path>
  <sc-if value="{{ diamond }}" hint-placeholder-val="{{ true }}">
    <path d="M32 37.5 L39.5 45 L32 52.5 L24.5 45 Z" fill="{{ accent }}" stroke="{{ accent }}" stroke-width="3" stroke-linejoin="round"></path>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0E0F11&quot;,&quot;options&quot;:[&quot;#0E0F11&quot;,&quot;#F4F3F0&quot;,&quot;#F2A93B&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F2A93B&quot;,&quot;options&quot;:[&quot;#F2A93B&quot;,&quot;#0E0F11&quot;,&quot;#F4F3F0&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:6,&quot;max&quot;:16,&quot;tsType&quot;:&quot;number&quot;},&quot;diamond&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const size = p.size ?? '100%';
    return {
      w: size, h: size,
      ink: p.ink ?? '#0E0F11',
      accent: p.accent ?? '#F2A93B',
      weight: p.weight ?? 10,
      diamond: p.diamond !== false,
    };
  }
}
</script>
</body>
</html>
